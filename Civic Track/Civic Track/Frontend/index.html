<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicTrack | Official Government Portal</title>
    <!-- We are utilizing our newly authored Enterprise Design System -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        /* Specific overrides for the Auth Page */
        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            margin: 0 auto;
            border-top: 4px solid var(--primary-blue);
        }

        .auth-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .auth-header h2 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .seal {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .auth-divider::before, .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .auth-divider:not(:empty)::before { margin-right: .5em; }
        .auth-divider:not(:empty)::after { margin-left: .5em; }

    </style>
</head>
<body>

    <div class="split-layout">
        
        <!-- Left Side: Official Institutional Branding (Dark/Dense) -->
        <div class="split-left">
            <div class="seal">🏛️</div>
            <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">CivicTrack Portal</h1>
            <p style="font-size: 1.1rem; color: #cbd5e1; max-width: 400px; line-height: 1.6;">
                The official secure platform for citizens and authorized personnel to report, track, and manage civil incidents. 
                <br><br>
                Unauthorized access to this government system is strictly prohibited and monitored.
            </p>
        </div>

        <!-- Right Side: Interaction Form (Light/Clean) -->
        <div class="split-right">
            
            <div class="card auth-card">
                <div class="auth-header">
                    <h2>Secure Login</h2>
                    <p>Enter your credentials to access the system.</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="user@official.gov" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Secure Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="button" class="btn-primary" style="width: 100%; padding: 0.85rem;" onclick="secureLogin()">Authenticate</button>
                    
                    <div class="auth-divider">System Access</div>
                    <button type="button" class="btn-secondary" style="width: 100%; padding: 0.85rem;" onclick="window.location.href='register.html'">
                        Register as a New Citizen
                    </button>
                </form>

            </div>

        </div>

    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5079/api';

        async function secureLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) return alert("Please enter credentials.");

            try {
                const response = await fetch(`${API_BASE_URL}/Auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const user = await response.json();
                    
                    localStorage.setItem('civicUser', JSON.stringify(user));

                    if (user.role === 'Officer' || user.role === 'Admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    alert("Login Failed: Unauthorized Access.");
                }
            } catch (error) {
                console.error("Login failed:", error);
                alert("Terminal Error: Cannot connect to secure server.");
            }
        }
    </script>
</body>
</html>
