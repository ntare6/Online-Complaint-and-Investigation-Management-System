<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicTrack | Citizen Registration</title>
    <!-- Utilizing the Enterprise CSS system we built -->
    <link rel="stylesheet" href="styles.css">
    
    <style>
        .auth-card {
            width: 100%;
            max-width: 450px;
            padding: 3rem;
            margin: 0 auto;
            border-top: 4px solid var(--primary-blue);
        }
        .auth-header { margin-bottom: 2rem; text-align: center; }
        .auth-header h2 { font-size: 1.5rem; color: var(--text-dark); margin-bottom: 0.5rem; }
        .auth-header p { color: var(--text-muted); font-size: 0.9rem; }
        .seal { font-size: 4rem; margin-bottom: 1rem; opacity: 0.9; }
    </style>
</head>
<body>

    <div class="split-layout">
        
        <!-- Left Side: Official Institutional Branding (Dark/Dense) -->
        <div class="split-left">
            <div class="seal">📝</div>
            <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">Citizen Enrollment</h1>
            <p style="font-size: 1.1rem; color: #cbd5e1; max-width: 400px; line-height: 1.6;">
                By registering an official account, you gain the ability to lodge civil reports, track investigation timelines in real-time, and securely submit evidentiary documents.
            </p>
        </div>

        <!-- Right Side: Interaction Form (Light/Clean) -->
        <div class="split-right">
            
            <div class="card auth-card">
                <div class="auth-header">
                    <h2>Create Profile</h2>
                    <p>Enter your official details to proceed.</p>
                </div>

                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label">Full Legal Name</label>
                        <input type="text" id="regFullName" class="form-control" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="citizen@example.gov" required>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Contact Number</label>
                        <input type="tel" id="regPhone" class="form-control" placeholder="+250..." required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Secure Password</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="••••••••" required>
                    </div>

                    <button type="button" class="btn-primary" style="width: 100%; padding: 0.85rem;" onclick="secureRegister()">Enroll Now</button>
                    
                    <div style="text-align: center; margin-top: 1.5rem;">
                        <a href="index.html" style="color: var(--primary-blue); text-decoration: none; font-size: 0.9rem; font-weight: 600;">← Back to Secure Login</a>
                    </div>
                </form>
            </div>

        </div>

    </div>

    <!-- Backend Registration Integration Logic -->
    <script>
        const API_BASE_URL = 'http://localhost:5079/api';

        async function secureRegister() {
            const fullName = document.getElementById('regFullName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;

            if (!fullName || !email || !password) return alert("Please fill out all required fields.");

            try {
                // Connect to the BCrypt API you just built
                const response = await fetch(`${API_BASE_URL}/Auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, phone, password })
                });

                if (response.ok) {
                    alert("Registration successful! You may now login.");
                    window.location.href = 'index.html'; // Instantly route them back to the portal gate
                } else {
                    const err = await response.text();
                    alert("Registration Failure: " + err);
                }
            } catch (error) {
                console.error("Registration failed:", error);
                alert("Terminal Error: Cannot connect to secure server.");
            }
        }
    </script>
</body>
</html>
