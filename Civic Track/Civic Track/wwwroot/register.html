<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CivicTrack | Citizen Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="split-layout">
        <section class="split-left">
            <div class="sidebar-title">Republic of Rwanda</div>
            <h1 style="color: var(--primary-blue); margin-bottom: 16px;">Citizen Registration</h1>
            <p style="color: var(--text-muted);">
                Register once to submit complaints, upload evidence, receive notifications, and track investigation progress.
            </p>
        </section>
        <section class="split-right">
            <div class="auth-card">
                <div class="sidebar-title">New Account</div>
                <h2 style="margin-bottom: 8px;">Create profile</h2>
                <p style="color: var(--text-muted); margin-bottom: 16px;">All fields marked required must be completed.</p>

                <form id="registerForm">
                    <div class="form-group">
                        <label class="form-label" for="regFullName">Full Name</label>
                        <input type="text" id="regFullName" class="form-control" placeholder="Full legal name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regEmail">Email Address</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="name@example.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regPhone">Phone Number</label>
                        <input type="tel" id="regPhone" class="form-control" placeholder="+250..." required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regPassword">Password</label>
                        <input type="password" id="regPassword" class="form-control" placeholder="At least 6 characters" required>
                    </div>
                    <button type="button" class="btn-primary" style="width:100%;" onclick="secureRegister()">Register account</button>
                    <button type="button" class="btn-secondary" style="width:100%; margin-top:8px;" onclick="window.location.href='index.html'">Back to sign in</button>
                </form>
            </div>
        </section>
    </div>

    <!-- Backend Registration Integration Logic -->
    <script>
        const API_BASE_URL = 'http://localhost:5079/api';

        async function secureRegister() {
            const fullName = document.getElementById('regFullName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;

            if (!fullName || !email || !password) return alert("Please fill out all required fields.");

            try {
                const response = await fetch(`${API_BASE_URL}/Auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ fullName, email, phone, password })
                });

                if (response.ok) {
                    alert("Registration successful. You can now sign in.");
                    window.location.href = 'index.html';
                } else {
                    const err = await response.text();
                    alert("Registration failed: " + err);
                }
            } catch (error) {
                alert("Unable to connect to server.");
            }
        }
    </script>
</body>
</html>
